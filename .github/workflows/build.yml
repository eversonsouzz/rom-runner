name: Build LineageOS 18.1 (rav) via Crave

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Instalar Crave CLI
        run: |
          mkdir -p ~/.crave
          echo '${{ secrets.CRAVE_JSON }}' > ~/.crave/crave.json
          curl -s https://raw.githubusercontent.com/accupara/crave/main/crave_install.sh | bash
          sudo mv crave /usr/local/bin/

      - name: Rodar Build no Crave
        run: |
          # 1. Configura o manifesto local no repositório antes de enviar
          mkdir -p .repo/local_manifests
          cat <<EOF > .repo/local_manifests/rav.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="github-direct" fetch="https://github.com/" />

            <!-- Device Trees -->
            <project path="device/motorola/rav" name="sjllls/android_device_motorola_rav" remote="github-direct" revision="lineage-18.1" />
            <project path="device/motorola/trinket-common" name="LineageOS/android_device_motorola_trinket-common" remote="github-direct" revision="refs/heads/lineage-18.1" />
            
            <!-- Kernel sm6125 -->
            <project path="kernel/motorola/sm6125" name="sjllls/android_kernel_motorola_sm6125" remote="github-direct" revision="lineage-18.1" />
            
            <!-- Vendor Unificado -->
            <project path="vendor/motorola" name="TheMuppets/proprietary_vendor_motorola" remote="github-direct" revision="lineage-18.1" />
          </manifest>
          EOF

          # 2. Inicializa o ambiente de dev do Crave
          crave devinit --project-name "LineageOS-18.1" || true

          # 3. Dispara a compilação completa no servidor do Crave
          crave run -- "repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --git-lfs --depth=1 && \
                        repo sync -c --no-clone-bundle --no-tags --force-sync -j\$(nproc) && \
                        source build/envsetup.sh && \
                        lunch lineage_rav-userdebug && \
                        m bacon"

      - name: Baixar Artefatos do Crave
        run: |
          crave pull out/target/product/rav/*.zip
          crave pull out/target/product/rav/*.img

      - name: Upload da ROM para o GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-18.1-rav-Crave
          path: |
            *.zip
            *.img
          if-no-files-found: warn
