name: Build ROM Release Keys (Strong Integrity)

on:
  workflow_dispatch:
    inputs:
      DEVICE_CODENAME:
        description: 'Codinome do modelo (ex: sofia, rav, ocean, fiji)'
        required: true
        default: 'sofia'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. Limpa o disco do runner para caber os arquivos da ROM (~40GB)
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h /

      # 2. Ativa 12GB de SWAP de forma segura
      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # 3. Instala as ferramentas de build no sistema Linux (Corrigido ccache e repositórios)
      - name: Install Build Dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache python3 \
            flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev \
            lib32z1-dev libc6-dev-i386 libgl1-mesa-dev libxml2-utils \
            xsltproc unzip zip curl lzop pngcrush schedtool squashfs-tools \
            zlib1g-dev libssl-dev libelf-dev openjdk-17-jdk
          
          # Aponta 'python' para 'python3' manualmente para nao falhar no apt
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      # 4. Baixa a fonte da ROM e associa com o SEU FORK
      - name: Sync Source Code & Local Manifests
        run: |
          export PATH="$HOME/bin:$PATH"
          mkdir -p work
          cd work
          
          # Inicia a sincronizacao com a ROM base
          repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1
          
          mkdir -p .repo/local_manifests
          
          # AQUI JA ESTA O SEU FORK CONFIGURADO!
          cat <<EOF > .repo/local_manifests/trinket.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/motorola/trinket-common" name="eversonsouzz/android_device_motorola_amogus" remote="github" revision="lineage-21" />
            <project path="device/motorola/${{ github.event.inputs.DEVICE_CODENAME }}" name="electimon/android_device_motorola_${{ github.event.inputs.DEVICE_CODENAME }}" remote="github" revision="lineage-21" />
            <project path="kernel/motorola/trinket" name="electimon/android_kernel_motorola_trinket" remote="github" revision="lineage-21" />
            <project path="vendor/motorola" name="TheMuppets/proprietary_vendor_motorola" remote="github" revision="lineage-21" />
          </manifest>
          EOF

          # Baixa o codigo em modo leve (depth 1)
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

      # 5. GERADOR DE CHAVES OFICIAIS (Substitui as testkeys públicas)
      - name: Generate Release Keys
        run: |
          cd work
          mkdir -p certs
          
          AUTH='/C=US/ST=California/L=MountainView/O=Android/OU=Android/CN=Android/emailAddress=android@android.com'
          
          # Gera os certificados privados PKCS#8 para assinar a ROM
          for key in releasekey platform shared media testkey bluetooth sdk_addon; do
            ./development/tools/make_key certs/$key "$AUTH" <<EOF

          EOF
          done

      # 6. Compila a ROM forcando assinatura com RELEASE-KEYS
      - name: Build ROM
        run: |
          export PATH="$HOME/bin:$PATH"
          cd work
          source build/envsetup.sh
          
          lunch lineage_${{ github.event.inputs.DEVICE_CODENAME }}-userdebug
          
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          
          # Forca o sistema a usar as suas chaves recem-criadas
          export PRODUCT_DEFAULT_DEV_CERTIFICATE=certs/releasekey
          export BUILD_KEYS=release-keys
          
          # Compila o arquivo instalavel (.zip)
          m bacon -j$(nproc --all)

      # 7. Salva a ROM e a chave gerada nos artefatos do GitHub
      - name: Upload ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ROM-ReleaseKeys-${{ github.event.inputs.DEVICE_CODENAME }}
          path: |
            work/out/target/product/${{ github.event.inputs.DEVICE_CODENAME }}/*.zip
            work/certs/
          if-no-files-found: warn
